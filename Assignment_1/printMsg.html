<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h4>Divisibility Check 1 to 100</h4>
    <button type="submit" onclick="checkNum()">Print Message </button>
</body>
<script>
    function checkNum() {
        for (let i = 1; i <= 100; i++) {

            if (i % 3 == 0 && i % 5 == 0)
                document.write(i + " : Number is divisible by 3 and 5 both<br>");

            else if (i % 3 == 0)
                document.write(i + " : Number is divisible by 3<br>");

            else if (i % 5 == 0)
                document.write(i + " : Number is divisible by 5<br>");
        }
    }
</script>
</html>
